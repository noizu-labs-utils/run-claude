  haiku_model: "cerebras-pro/glm-4.7"

# Groq - Ultra-fast inference
# Llama 3/4, Kimi K2, and Qwen3-32b were shut down / moved to Enterprise-only
# on Groq (2026); the live catalog is GPT-OSS, Compound, Qwen3.6-27B,
# MiniMax M2.7, and the safety/guard models. See groq-pro for the [1m]-suffixed
# aliases Claude Code v2.1.116+ appends for 1M-context requests.
groq:
  name: "Groq"
  fable_model: "groq/gpt-oss-120b (high)"
  opus_model: "groq/gpt-oss-120b (medium)"
  sonnet_model: "groq-qwen3.6-27b"
  haiku_model: "groq/gpt-oss-20b (low)"
  extended:
  - "groq/gpt-oss-120b (high)[1m]"
  - "groq/gpt-oss-120b (medium)[1m]"
  - "groq/gpt-oss-20b (low)[1m]"
  - "groq-qwen3.6-27b[1m]"
  - "groq-compound"
  - "groq-compound-mini"
  - "groq-gpt-oss-20b"
  - "groq-safety-gpt-oss-20b"
  - "groq-minimax-m2.7"
groq2:
  name: "Groq (Speed)"
  opus_model: "groq.gpt-oss-120b"
  sonnet_model: "groq-qwen3.6-27b"
  haiku_model: "groq-gpt-oss-20b"

# Groq Mix - Optimized Groq blend (intelligence-first)
groq-mix:
  name: "Groq Mix (Intelligence-First)"
  opus_model: "groq-compound"
  sonnet_model: "groq.gpt-oss-120b"
  haiku_model: "groq-qwen3.6-27b"
  fable_model: "groq/gpt-oss-120b (high)"
  extended:
  - "groq-compound-mini"
  - "groq-gpt-oss-20b"
  - "groq-safety-gpt-oss-20b"
  - "groq-minimax-m2.7"

