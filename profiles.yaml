# run-claude profiles
#
# Profile search order (first match wins):
# 1. ~/.config/run-claude/user.profiles.yaml
# 2. ~/.config/run-claude/profiles.yaml
# 3. <install>/user.profiles.yaml
# 4. <install>/profiles.yaml
#
# To disable a profile from a higher-priority file, set model: null or model: false
# Example:
#   cerebras:
#     model: null  # This disables cerebras, falling through to lower-priority files
#
# env_passthrough: true (per profile) = endpoint-only override: export
# ANTHROPIC_BASE_URL / API_TIMEOUT_MS but no ANTHROPIC_DEFAULT_*_MODEL, so
# Claude Code picks its own default models.

# Anthropic - Native Claude models (endpoint-only passthrough)
anthropic:
  name: "Anthropic"
  fable_model: "claude-fable-5-1"
  opus_model: "claude-opus-5"
  sonnet_model: "claude-sonnet-5"
  haiku_model: "claude-haiku-4-5-20251001"
  env_passthrough: true  # endpoint-only override; Claude Code picks its own models
  extended:
  - "claude-fable-5-1[1m]"
  - "claude-opus-5-5"
  - "claude-sonnet-5-5"
  - "claude-haiku-5-5"
  # zai / zai-alt / zai-oa / zai-oa-alt families
  - "zai/glm-5.3"
  - "zai/glm-5.3[1m]"
