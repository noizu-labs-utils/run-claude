apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "run-claude-landing.fullname" . }}
  labels:
    {{- include "run-claude-landing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "run-claude-landing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "run-claude-landing.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: web
        image: {{ .Values.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.port }}
          protocol: TCP
        env:
        - name: PORT
          value: {{ .Values.port | quote }}
        - name: PHX_HOST
          value: {{ .Values.domain | quote }}
        - name: HOLOGRAM_START
          value: "1"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # Probes must hit a real Hologram route ("/", home_page.ex), not /healthz.
        # The endpoint mounts plug Hologram.Router BEFORE the Phoenix router and
        # Hologram.Router.call/2 returns the conn untouched (no halt, no response)
        # when Hologram is disabled — requests fall through to Phoenix, where only
        # /healthz exists. A /healthz probe therefore answers 200 even while every
        # page 404s: blind. A routed probe fails when the router is dark.
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.port }}
            httpHeaders:
            - name: Host
              value: {{ .Values.domain | quote }}
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.port }}
            httpHeaders:
            - name: Host
              value: {{ .Values.domain | quote }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
      restartPolicy: Always
